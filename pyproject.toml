[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leparallax"
version = "0.1.0"
description = "Aspect-seeing in action-conditioned world models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "d4vid-le" }]
dependencies = [
  "mlx>=0.30",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["leparallax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
